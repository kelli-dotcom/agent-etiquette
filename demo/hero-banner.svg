<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 290" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171306"/>
      <stop offset="55%" stop-color="#261f09"/>
      <stop offset="100%" stop-color="#120f05"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="290" rx="14" fill="url(#goldBg)" stroke="#eab308" stroke-width="2"/>
  <rect x="16" y="16" width="1048" height="258" rx="10" fill="none" stroke="#eab308" stroke-width="1" opacity="0.3"/>

  <!-- Left Title Block -->
  <text x="52" y="62" fill="#facc15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="2.2">🟡 AGENT-ETIQUETTE // RULE-OF-2 GOVERNANCE · LAYER 3</text>
  <text x="52" y="114" fill="#fefce8" font-family="Lora, Georgia, serif" font-size="42" font-weight="600">Agent Etiquette</text>
  <rect x="52" y="128" width="360" height="3.5" rx="2" fill="url(#goldBar)"/>
  <text x="52" y="162" fill="#fef08a" font-family="'Source Sans 3', system-ui, -apple-system, sans-serif" font-size="16">Stop AI coding agents from looping, thrashing context, or fabricating verification passes.</text>
  <text x="52" y="186" fill="#d4c794" font-family="'Source Sans 3', system-ui, -apple-system, sans-serif" font-size="14.5">Strict 7-field JSON handoff contracts · Max 3 concurrent agents · Rule-of-2 circuit breaker.</text>

  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">
    <rect x="52" y="210" width="160" height="34" rx="7" fill="#2e260a" stroke="#eab308" stroke-width="1.5"/>
    <text x="132" y="231" fill="#fefce8" text-anchor="middle">MAX 3 AGENTS</text>

    <rect x="224" y="210" width="176" height="34" rx="7" fill="#2e260a" stroke="#facc15" stroke-width="1.3"/>
    <text x="312" y="231" fill="#fef08a" text-anchor="middle">RULE OF 2 BREAKER</text>

    <rect x="412" y="210" width="174" height="34" rx="7" fill="#2e260a" stroke="#facc15" stroke-width="1.3"/>
    <text x="499" y="231" fill="#fde047" text-anchor="middle">LIVE VALIDATOR ↗</text>
  </g>

  <!-- Right Panel: Rule-of-2 Circuit Breaker & 3-Agent Cap Schematic -->
  <g transform="translate(618, 36)" font-family="ui-monospace, SFMono-Regular, monospace">
    <!-- Circuit Breaker Box -->
    <rect x="0" y="0" width="414" height="102" rx="9" fill="#1e1908" stroke="#eab308" stroke-width="1.5"/>
    <text x="16" y="24" fill="#facc15" font-size="11.5" font-weight="800">RULE-OF-2 CIRCUIT BREAKER</text>
    <rect x="16" y="38" width="112" height="46" rx="6" fill="#2b240b" stroke="#84cc16"/>
    <text x="72" y="59" fill="#bef264" font-size="11" font-weight="700" text-anchor="middle">RETRY 0</text>
    <text x="72" y="75" fill="#d4c794" font-size="9.5" text-anchor="middle">Run &amp; Verify</text>

    <rect x="148" y="38" width="112" height="46" rx="6" fill="#2b240b" stroke="#f59e0b"/>
    <text x="204" y="59" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">RETRY 1</text>
    <text x="204" y="75" fill="#d4c794" font-size="9.5" text-anchor="middle">1 Surgical Fix</text>

    <rect x="280" y="38" width="118" height="46" rx="6" fill="#3b1219" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="339" y="59" fill="#fda4af" font-size="11" font-weight="800" text-anchor="middle">FAIL #2: HALT</text>
    <text x="339" y="75" fill="#fecdd3" font-size="9.5" text-anchor="middle">Escalate Blocker</text>

    <!-- Concurrency Cap + Contract Box -->
    <rect x="0" y="116" width="414" height="102" rx="9" fill="#1e1908" stroke="#ca8a04" stroke-width="1.4"/>
    <text x="16" y="140" fill="#facc15" font-size="11.5" font-weight="800">CONCURRENCY CAP &amp; HANDOFF CONTRACT</text>
    <g font-size="10.5">
      <rect x="16" y="154" width="88" height="46" rx="5" fill="#2b240b" stroke="#eab308"/>
      <text x="60" y="175" fill="#fef08a" font-weight="700" text-anchor="middle">AGENT 1</text>
      <text x="60" y="191" fill="#d4c794" font-size="9" text-anchor="middle">ACTIVE</text>

      <rect x="114" y="154" width="88" height="46" rx="5" fill="#2b240b" stroke="#eab308"/>
      <text x="158" y="175" fill="#fef08a" font-weight="700" text-anchor="middle">AGENT 2</text>
      <text x="158" y="191" fill="#d4c794" font-size="9" text-anchor="middle">ACTIVE</text>

      <rect x="212" y="154" width="88" height="46" rx="5" fill="#2b240b" stroke="#eab308"/>
      <text x="256" y="175" fill="#fef08a" font-weight="700" text-anchor="middle">AGENT 3</text>
      <text x="256" y="191" fill="#d4c794" font-size="9" text-anchor="middle">MAX CAP</text>

      <rect x="310" y="154" width="88" height="46" rx="5" fill="#261317" stroke="#f43f5e" stroke-dasharray="4 3"/>
      <text x="354" y="175" fill="#fda4af" font-weight="700" text-anchor="middle">AGENT 4</text>
      <text x="354" y="191" fill="#fda4af" font-size="9" text-anchor="middle">BLOCKED</text>
    </g>
  </g>
</svg>
