<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Etiquette — Live Multi-Agent Handoff &amp; Rule-of-2 Validator Demo</title>
  <style>
    :root { --bg:#0b1120; --panel:#111827; --card:#1e293b; --border:#334155; --text:#f8fafc; --muted:#94a3b8; --emerald:#10b981; --amber:#f59e0b; --rose:#f43f5e; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:24px; }
    .container { max-width:1060px; margin:0 auto; }
    .header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:14px; margin-bottom:18px; }
    .badge { padding:5px 12px; border-radius:4px; font-size:12px; font-weight:700; font-family:ui-monospace,monospace; }
    .grid { display:grid; grid-template-columns:340px 1fr; gap:18px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:16px; }
    .panel h2 { font-size:13px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
    .btn { width:100%; text-align:left; background:var(--card); color:var(--text); border:1px solid var(--border); padding:10px 12px; border-radius:4px; margin-bottom:8px; cursor:pointer; font-size:13px; font-weight:600; }
    .btn.active { border-color:var(--emerald); color:var(--emerald); }
    .code { background:#070b14; border:1px solid var(--border); border-radius:6px; padding:14px; font-family:ui-monospace,monospace; font-size:12px; white-space:pre-wrap; color:#a7f3d0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 style="font-size:22px;font-weight:800;">Agent Etiquette · Live Handoff &amp; Rule-of-2 Simulator</h1>
        <p style="font-size:13px;color:var(--muted);">Max 3 Active Agents · Verified Artifacts Only · Automatic Rule-of-2 Escalation</p>
      </div>
      <div id="statusBadge" class="badge" style="background:rgba(16,185,129,0.15);color:var(--emerald);border:1px solid var(--emerald);">STATUS: PASS</div>
    </div>
    <div class="grid">
      <div class="panel">
        <h2>Simulate Handoff State</h2>
        <button class="btn active" id="b0" onclick="setScenario(0)">1. Clean Gatekeeper Pass (Retry 0)</button>
        <button class="btn" id="b1" onclick="setScenario(1)">2. Disguised-Hybrid Blocked (Retry 1)</button>
        <button class="btn" id="b2" onclick="setScenario(2)">3. Rule-of-2 Escalation Halt (Retry 2)</button>
      </div>
      <div class="panel">
        <h2>Validated JSON Handoff Payload (OpenFlexAgentHandoff)</h2>
        <div id="payloadBox" class="code"></div>
      </div>
    </div>
  </div>
  <script>
    const SCENARIOS = [
      {
        badge: "STATUS: PASS (LAUNCH UNLOCKED)", color: "#10b981",
        payload: {
          task_id: "OF-2026-sync-61",
          from_agent: "Zero-Mercy Gatekeeper",
          to_agent: "launch-director",
          status: "pass",
          retry_count: 0,
          active_agents_count: 3,
          verified_artifacts: ["src/lib/scrapers/greenhouse.ts", "src/lib/ai/verify-job.ts", "greenhouse:gitlab"],
          gatekeeper_flags: []
        }
      },
      {
        badge: "STATUS: BLOCKED (RETRY 1 / 2)", color: "#f59e0b",
        payload: {
          task_id: "OF-2026-audit-19",
          from_agent: "Zero-Mercy Gatekeeper",
          to_agent: "Trojan Janitor",
          status: "blocked",
          retry_count: 1,
          active_agents_count: 2,
          verified_artifacts: ["src/lib/ai/verify-job.ts"],
          gatekeeper_flags: ["DISGUISED_HYBRID: '3 days in office required'", "MISSING_SALARY_BOUNDS"]
        }
      },
      {
        badge: "STATUS: ESCALATED_RULE_OF_2 (HALT)", color: "#f43f5e",
        payload: {
          task_id: "OF-2026-audit-19",
          from_agent: "Zero-Mercy Gatekeeper",
          to_agent: "The Boss",
          status: "escalated_rule_of_2",
          retry_count: 2,
          active_agents_count: 1,
          verified_artifacts: ["src/lib/scrapers/audit-links.ts"],
          gatekeeper_flags: ["RULE_OF_2_TRIGGERED: Halted automatic retries for orchestrator review"]
        }
      }
    ];
    function setScenario(i) {
      document.querySelectorAll(".btn").forEach((b, idx) => b.classList.toggle("active", idx === i));
      const s = SCENARIOS[i];
      const badge = document.getElementById("statusBadge");
      badge.textContent = s.badge;
      badge.style.color = s.color;
      badge.style.borderColor = s.color;
      document.getElementById("payloadBox").textContent = JSON.stringify(s.payload, null, 2);
    }
    setScenario(0);
  </script>
</body>
</html>
